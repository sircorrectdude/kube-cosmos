          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: payment.conf }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 5 }
          resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { memory: 64Mi } }
      volumes: [{ name: conf, configMap: { name: shop-nginx } }]
---
# recommender: erzeugt echte CPU- und Speicherlast (für die optionale Prometheus-Darstellung)
#   /work      ~15 ms CPU pro Request (pbkdf2)      → CPU-Limit 300m → Pod glüht orange
#   /mem?mb=N  belegt N MB RAM (Limit 192Mi)         → > 85 % → Pod pulsiert rot
apiVersion: v1
kind: ConfigMap
metadata: { name: recommender, namespace: traffic-demo }
data:
  server.js: |
    const http = require('http'), crypto = require('crypto');
    let hog = [], hogMb = 0;
    const log = (req, code) => {
      const ip = (req.socket.remoteAddress || '').replace('::ffff:', '');
      console.log(`${ip} - - [${new Date().toISOString()}] "${req.method} ${req.url} HTTP/1.1" ${code} 0 "-" "-"`);
    };
    http.createServer((req, res) => {
      const u = new URL(req.url, 'http://x');
      if (u.pathname === '/healthz') return res.end('ok');
      let code = 200, body = '{"ok":true}';
      if (u.pathname === '/work') {
        crypto.pbkdf2Sync('kube', 'cosmos', Number(u.searchParams.get('n') || 25000), 32, 'sha256');
        body = '{"recommendations":3}';
      } else if (u.pathname === '/mem') {
        const mb = Math.max(0, Math.min(200, Number(u.searchParams.get('mb') || 0)));
        if (mb < hogMb) { hog = []; hogMb = 0; }
        while (hogMb < mb) { hog.push(Buffer.alloc(1048576, 1)); hogMb++; }
        body = `{"heldMb":${hogMb}}`;
      } else if (u.pathname !== '/') code = 404;
      log(req, code);
      res.writeHead(code, { 'content-type': 'application/json' }).end(body);
    }).listen(8080);
---
apiVersion: v1
kind: Service
metadata: { name: recommender, namespace: traffic-demo }
spec:
  selector: { app: recommender }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: recommender, namespace: traffic-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: recommender } }
  template:
    metadata:
      labels: { app: recommender, kube-cosmos.io/access-log: node }
    spec:
      containers:
        - name: node
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: app, mountPath: /app }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 300m, memory: 192Mi }
      volumes: [{ name: app, configMap: { name: recommender } }]
